[project]
name = "nifty-pulse"
version = "0.1.0"
description = "Real-time NIFTY 50 analytics, multi-strategy signal engine, and short-horizon ML forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "protobuf>=5.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "grpcio-tools>=1.66.0",
    "ruff>=0.7.0",
]

[project.scripts]
niftypulse = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The layout is flat: everything lives directly under src/, so there is no
# single importable root package. `sources` remaps src/ onto the wheel root,
# which makes each top-level directory (core, kernel, plugins, runtime, ...) an
# importable package and cli.py the console-script module.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
