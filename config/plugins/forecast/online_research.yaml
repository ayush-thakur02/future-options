# null paths resolve beneath data/research.
state_path: null
# A mapping enables each learner and exposes its own tuning knobs. These models
# learn only from matured, forward outcomes recorded by the research ledger.
algorithms:
  online_logistic:
    learning_rate: 0.04
    l2: 0.0001
  passive_aggressive:
    aggressiveness: 0.2
  gaussian_nb:
    variance_floor: 0.000001
  ftrl_proximal:
    alpha: 0.08
    beta: 1.0
    l1: 0.002
    l2: 0.01
  adaptive_knn:
    k: 11
    window: 160
    half_life: 80.0
    max_features: 48
    prior_strength: 2.0
  strategy_combinations:
    max_active: 8
    max_order: 3
    min_support: 4
    min_strength: 0.15
    prior_strength: 2.0
    decay: 0.995
    max_states: 5000
# Strongest strategies used for explicit pair/triple interaction features sent
# to FTRL, KNN and the other online learners.
strategy_feature_limit: 8
interaction_order: 3
rolling_window: 100
min_trust_samples: 50
min_trust_for_action: 0.15
buy_probability: 0.56
sell_probability: 0.44
# null derives the hurdle from the platform cost model.
cost_bps: null
